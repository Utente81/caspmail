name: CI - Code Quality & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Linting)
        run: |
          # If ESLint is not installed globally or in package.json, this will fail gracefully.
          # We run it if it exists.
          if grep -q eslint package.json; then
            npm run lint
          else
            echo "No eslint config found, skipping." || echo "No eslint config found, proceeding."
          fi

  quality-frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Code Quality (Linting)
        run: |
          if grep -q eslint package.json; then
            npm run lint
          else
            echo "No eslint config found, skipping." || true
          fi

      - name: Test Build
        run: npm run build
