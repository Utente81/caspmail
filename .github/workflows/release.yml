name: Release - SBOM & Sign

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

jobs:
  sbom-and-sign:
    name: Generate SBOM and Sign Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # Needed for keyless signing with Cosign

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      # Note: For this to work fully in a real environment, you need a Container Registry.
      # We are simulating the process here by building the image locally.
      - name: Build Docker Image
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          cd backend
          docker build -t ghcr.io/$REPO/backend:$REF .

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@7ccf588e3cf3cc2611714c2eeae48550fbc17552 # v0.15.11 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Generate SBOM
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          syft ghcr.io/$REPO/backend:$REF -o spdx-json=sbom-backend.spdx.json

      - name: Create Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          files: sbom-backend.spdx.json
          generate_release_notes: true

      # - name: Log in to GHCR
      #   uses: docker/login-action@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      
