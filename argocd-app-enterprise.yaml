apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: caspermail-enterprise
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'git@github.com:Utente81/caspmail.git'
    targetRevision: enterprise
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: caspermail-enterprise
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
