- apiVersion: v1
  data:
    app.mjs: "import Fastify from 'fastify';\nimport cors from '@fastify/cors';\n\
      import helmet from '@fastify/helmet';\nimport rateLimit from '@fastify/rate-limit';\n\
      \nimport { runMigrations } from './db/migrate.mjs';\nimport pool from './db/pool.mjs';\n\
      import healthRoutes from './routes/health.mjs';\nimport adminRoutes from './routes/admin.mjs';\n\
      import socRoutes, { startSoarWorker } from './routes/soc.mjs';\nimport mailRoutes\
      \ from './routes/mail.mjs';\nimport organizationRoutes from './routes/organization.mjs';\n\
      import contactsRoutes from './routes/contacts.mjs';\n\n// Global cache for SOAR\
      \ Application Firewall\nexport const blockedIps = new Set();\nexport function\
      \ blockIp(ip) {\n  blockedIps.add(ip);\n}\n\nconst PORT = parseInt(process.env.PORT\
      \ || '3000', 10);\nconst HOST = process.env.HOST || '0.0.0.0';\n\nfunction sanitizedUrl(url\
      \ = '') {\n  return String(url).split('?')[0];\n}\n\nconst app = Fastify({\n\
      \  bodyLimit: 52428800, // 50MB per payloads (allegati)\n  logger: {\n    level:\
      \ process.env.LOG_LEVEL || 'info',\n    serializers: {\n      req(req) {\n \
      \       return {\n          method: req.method,\n          url: sanitizedUrl(req.url),\n\
      \          hostname: req.hostname,\n          remoteAddress: req.ip,\n     \
      \     remotePort: req.socket?.remotePort,\n        };\n      },\n    },\n  \
      \  transport: process.env.NODE_ENV !== 'production'\n      ? { target: 'pino-pretty'\
      \ }\n      : undefined,\n  },\n  trustProxy: true,\n});\n\n// \u2500\u2500\u2500\
      \ Security Headers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nawait app.register(helmet, {\n\
      \  contentSecurityPolicy: false, // Managed by nginx\n});\n\n// \u2500\u2500\
      \u2500 CORS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\n\nawait app.register(cors, {\n  origin: (process.env.CORS_ORIGINS\
      \ || 'https://secure.internal').split(','),\n  credentials: true,\n});\n\n\n\
      \n// \u2500\u2500\u2500 Rate Limiting & Firewall (layered, enterprise-grade)\
      \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\n//\n//  Global Firewall: Blocks IPs requested by SOAR\
      \ Playbooks\n//  Global Rate Limiting: 200 req/min per real IP   (broad protection)\n\
      //  Auth endpoints:   20 req/min per real IP   (brute-force mitigation)\n//\
      \  Write endpoints:  60 req/min per real IP   (mutation protection)\n//\n//\
      \ The keyGenerator always resolves the real client IP even when behind nginx.\n\
      \nfunction realIp(req) {\n  return req.headers['x-real-ip'] || req.headers['x-forwarded-for']?.split(',')[0]?.trim()\
      \ || req.ip;\n}\n\nfunction logWafEvent(ip, type, severity, message, mitre_technique)\
      \ {\n  let displayIp = ip;\n  // If the IP is internal (like when hitting from\
      \ localhost via Ingress), spoof it for the Threat Map demo\n  if (ip.startsWith('10.')\
      \ || ip.startsWith('192.168.') || ip.startsWith('127.')) {\n    const publicPrefixes\
      \ = ['114.114', '46.22', '104.28', '177.10', '41.220', '183.192', '198.51',\
      \ '95.108'];\n    displayIp = publicPrefixes[Math.floor(Math.random() * publicPrefixes.length)]\
      \ + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() *\
      \ 255);\n  }\n\n  const tenantId = 'acme-corp'; // Default tenant for network-level\
      \ events\n  const raw = {\n    mitre_tactic: type === 'rate_limit' ? 'Impact'\
      \ : 'Initial Access',\n    mitre_technique,\n    ueba_score: severity === 'high'\
      \ ? 85 : 40,\n    threat_intelligence: 'Native WAF Sensor'\n  };\n  pool.query(\n\
      \    `INSERT INTO soc_events (tenant_id, type, severity, source_ip, message,\
      \ raw)\n     VALUES ($1, $2, $3, $4, $5, $6)`,\n    [tenantId, type, severity,\
      \ displayIp, message, JSON.stringify(raw)]\n  ).catch(() => {});\n}\n\n// Global\
      \ Firewall Hook\napp.addHook('onRequest', async (req, reply) => {\n  const ip\
      \ = realIp(req);\n  if (blockedIps.has(ip)) {\n    logWafEvent(ip, 'firewall_block',\
      \ 'medium', 'Blocked IP attempted connection', 'T1090');\n    return reply.status(403).send({\
      \ error: 'Forbidden', message: 'Your IP address has been blocked by SOC policies.'\
      \ });\n  }\n});\n\nimport { v4 as uuidv4 } from 'uuid';\n// ITAM Autodiscovery\
      \ Hook\napp.addHook('onResponse', (req, reply, done) => {\n  if (req.user &&\
      \ (req.user.email || req.user.preferred_username)) {\n    const email = req.user.email\
      \ || req.user.preferred_username;\n    const ip = realIp(req);\n    const ua\
      \ = req.headers['user-agent'] || 'Unknown';\n    // Fire and forget\n    pool.query('SELECT\
      \ tenant_id FROM users WHERE email = $1', [email])\n      .then(({rows}) =>\
      \ {\n        if (rows.length > 0) {\n          pool.query(`\n            INSERT\
      \ INTO assets (id, tenant_id, ip_address, device_type, last_seen)\n        \
      \    VALUES ($1, $2, $3, $4, NOW())\n            ON CONFLICT (tenant_id, ip_address)\n\
      \            DO UPDATE SET last_seen = NOW(), device_type = $4\n          `,\
      \ [uuidv4(), rows[0].tenant_id, ip, ua]).catch(()=>{});\n        }\n      }).catch(()=>{});\n\
      \  }\n  done();\n});\n\n// Global rate-limit (applied to all routes via plugin)\n\
      await app.register(rateLimit, {\n  max: 100,\n  timeWindow: '1 minute',\n  keyGenerator:\
      \ realIp,\n  errorResponseBuilder(req, context) {\n    const ip = realIp(req);\n\
      \    logWafEvent(ip, 'rate_limit', 'high', 'Global Rate Limit Exceeded (Possible\
      \ DoS)', 'T1498');\n    return {\n      statusCode: 429,\n      error: 'Too\
      \ Many Requests',\n      message: `Rate limit exceeded. Try again in ${context.after}.`,\n\
      \    };\n  },\n});\n\n// \u2500\u2500\u2500 Per-route rate-limit hooks \u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\n\n// Stricter limits for authentication-sensitive\
      \ routes (e2ee send, admin write ops)\nconst authRateLimit = {\n  config: {\n\
      \    rateLimit: {\n      max: 10,\n      timeWindow: '1 minute',\n      keyGenerator:\
      \ realIp,\n      errorResponseBuilder(req, context) {\n        const ip = realIp(req);\n\
      \        logWafEvent(ip, 'rate_limit_auth', 'critical', 'Auth Rate Limit Exceeded\
      \ (Brute-Force)', 'T1110');\n        return {\n          statusCode: 429,\n\
      \          error: 'Too Many Requests',\n          message: `Sensitive endpoint\
      \ rate limit exceeded. Try again in ${context.after}.`,\n        };\n      },\n\
      \    },\n  },\n};\n\n// Medium limit for mutating admin/SOC routes\nconst writeRateLimit\
      \ = {\n  config: {\n    rateLimit: {\n      max: 60,\n      timeWindow: '1 minute',\n\
      \      keyGenerator: realIp,\n    },\n  },\n};\n\n// \u2500\u2500\u2500 Routes\
      \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\n\nawait app.register(healthRoutes);\nawait app.register(adminRoutes,\
      \ { prefix: '/api/admin', rateLimitHooks: { authRateLimit, writeRateLimit }\
      \ });\nawait app.register(socRoutes, { prefix: '/api/v4/soc', rateLimitHooks:\
      \ { writeRateLimit } });\nawait app.register(socRoutes, { prefix: '/api/soc',\
      \ rateLimitHooks: { writeRateLimit } });\nawait app.register(mailRoutes, { rateLimitHooks:\
      \ { authRateLimit, writeRateLimit } });\nawait app.register(organizationRoutes,\
      \ { rateLimitHooks: { authRateLimit, writeRateLimit } });\nawait app.register(contactsRoutes,\
      \ { rateLimitHooks: { authRateLimit, writeRateLimit } });\n\n// \u2500\u2500\
      \u2500 Global Error Handler \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\n\napp.setErrorHandler((err, req, reply) => {\n\
      \  const statusCode = err.statusCode || 500;\n  app.log.error({ err, url: sanitizedUrl(req.url),\
      \ method: req.method }, 'Request error');\n  reply.status(statusCode).send({\n\
      \    statusCode,\n    error: err.name || 'Error',\n    message: statusCode <\
      \ 500 ? err.message : 'Internal Server Error',\n  });\n});\n\n// \u2500\u2500\
      \u2500 Graceful Shutdown \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst shutdown = async (signal)\
      \ => {\n  app.log.info({ signal }, 'Received shutdown signal, closing server...');\n\
      \  await app.close();\n  process.exit(0);\n};\n\nprocess.on('SIGTERM', () =>\
      \ shutdown('SIGTERM'));\nprocess.on('SIGINT',  () => shutdown('SIGINT'));\n\n\
      // \u2500\u2500\u2500 Startup \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\n\ntry {\n  app.log.info('Running database migrations...');\n\
      \  await runMigrations();\n  app.log.info('Migrations complete.');\n\n  // Load\
      \ blocked IPs into memory firewall\n  const { rows: blockedRows } = await pool.query('SELECT\
      \ ip FROM soc_blocked_ips');\n  for (const row of blockedRows) {\n    blockedIps.add(row.ip);\n\
      \  }\n  app.log.info(`Firewall: Loaded ${blockedIps.size} blocked IPs from database.`);\n\
      \n  await app.listen({ port: PORT, host: HOST });\n  app.log.info(`CaspMail\
      \ backend listening on ${HOST}:${PORT}`);\n  \n  startSoarWorker(app);\n} catch\
      \ (err) {\n  app.log.error(err, 'Fatal startup error');\n  process.exit(1);\n\
      }\n\nexport default app;\n"
