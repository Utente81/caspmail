- apiVersion: v1
  data:
    mail.mjs: "import { v4 as uuidv4 } from 'uuid';\nimport pool from '../db/pool.mjs';\n\
      import { requireAuth } from '../auth/verify.mjs';\nimport { logSiemEvent } from\
      \ '../audit/siem.mjs';\n\nconst authGuard = { preHandler: requireAuth };\n\n\
      export default async function mailRoutes(app) {\n  // Helper: look up user row\
      \ from JWT email\n  async function getUser(jwtPayload) {\n    let email = jwtPayload.email\
      \ || jwtPayload.preferred_username || jwtPayload.sub;\n    if (!email) throw\
      \ new Error(\"Missing email, username and sub in JWT\");\n\n    let { rows }\
      \ = const res = await pool.query(\n      'SELECT * FROM users WHERE email =\
      \ $1 LIMIT 1',\n      [email]\n    );\n\n    if (rows.length === 0) {\n    \
      \  const name = jwtPayload.name || email.split('@')[0];\n      const tenant\
      \ = 'caspmail';\n      try {\n        const res = const res = await pool.query(\n\
      \          `INSERT INTO users (tenant_id, email, name, quota_mb) VALUES ($1,\
      \ $2, $3, 500) RETURNING *`,\n          [tenant, email, name]\n        );\n\
      \        rows = res.rows;\n      } catch (e) {\n        throw new Error(\"AUTO_PROVISION_FAIL:\
      \ \" + e.message + \" | email: \" + email);\n      }\n    }\n    \n    if (!rows[0])\
      \ throw new Error(\"User row is empty after insert\");\n    return rows[0];\n\
      \  }\n\n  // \u2500\u2500\u2500 Current User \u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\
      \  app.get('/api/me', authGuard, async (req, reply) => {\n    const user = await\
      \ getUser(req.user);\n    if (!user) return reply.status(404).send({ error:\
      \ 'User not found' });\n    reply.send(user); // nosemgrep: javascript.express.security.audit.xss.direct-response-write.direct-response-write\n\
      \  });\n\n  app.get('/api/me/dashboard', authGuard, async (req, reply) => {\n\
      \    const user = await getUser(req.user);\n    if (!user) return reply.status(404).send({\
      \ error: 'User not found' });\n\n    const [inbox, keys, storage] = await Promise.all([\n\
      \      pool.query(`\n        SELECT COUNT(*) AS total,\n               COUNT(*)\
      \ FILTER (WHERE read_at IS NULL) AS unread\n        FROM e2ee_messages\n   \
      \     WHERE tenant_id = $1 AND to_email = $2 AND deleted_at IS NULL AND recipient_deleted_at\
      \ IS NULL\n          AND COALESCE((recipient_flags->>'spam')::boolean, false)\
      \ = false\n          AND COALESCE((recipient_flags->>'archived')::boolean, false)\
      \ = false\n      `, [user.tenant_id, user.email]),\n      pool.query(`\n   \
      \     SELECT key_fingerprint, created_at\n        FROM e2ee_keys\n        WHERE\
      \ tenant_id = $1 AND user_email = $2\n        LIMIT 1\n      `, [user.tenant_id,\
      \ user.email]),\n      pool.query(`\n        SELECT\n          COUNT(*) AS message_count,\n\
      \          COALESCE(SUM(\n            octet_length(COALESCE(subject_encrypted,''))\
      \ +\n            octet_length(COALESCE(body_encrypted,'')) +\n            octet_length(COALESCE(nonce,''))\n\
      \          ), 0) AS bytes_used\n        FROM e2ee_messages\n        WHERE tenant_id\
      \ = $1 AND to_email = $2 AND deleted_at IS NULL\n      `, [user.tenant_id, user.email]),\n\
      \    ]);\n\n    const bytesUsed = Number(storage.rows[0]?.bytes_used || 0);\n\
      \    const mbUsed    = Math.round(bytesUsed / 1024 / 1024 * 100) / 100;\n  \
      \  const quotaMb   = user.quota_mb || 100;\n\n    reply.send({\n      user,\n\
      \      inbox: inbox.rows[0],\n      has_keys: keys.rows.length > 0,\n      key_fingerprint:\
      \ keys.rows[0]?.key_fingerprint || null,\n      storage: {\n        used_mb:\
      \    mbUsed,\n        quota_mb:   quotaMb,\n        used_pct:   Math.min(100,\
      \ Math.round((mbUsed / quotaMb) * 100)),\n        bytes_used: bytesUsed,\n \
      \     },\n    });\n  });\n\n  // \u2500\u2500\u2500 E2EE Keys \u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\n\n  \n\n\n\n  app.post('/api/e2ee/me/keys',\
      \ authGuard, async (req, reply) => {\n    try {\n      const user = await getUser(req.user);\n\
      \      if (!user) return reply.status(404).send({ error: 'User not found' });\n\
      \n      const { public_key, key_fingerprint, private_key_encrypted, private_key_salt\
      \ } = req.body || {};\n      if (!public_key || !key_fingerprint) {\n      \
      \  return reply.status(400).send({ error: 'public_key and key_fingerprint are\
      \ required' });\n      }\n\n      const { rows } = const res = await pool.query(\n\
      \        `INSERT INTO e2ee_keys (tenant_id, user_email, public_key, key_fingerprint,\
      \ private_key_encrypted, private_key_salt)\n         VALUES ($1, $2, $3, $4,\
      \ $5, $6)\n         ON CONFLICT (tenant_id, user_email)\n         DO UPDATE\
      \ SET public_key = EXCLUDED.public_key,\n                       key_fingerprint\
      \ = EXCLUDED.key_fingerprint,\n                       private_key_encrypted\
      \ = EXCLUDED.private_key_encrypted,\n                       private_key_salt\
      \ = EXCLUDED.private_key_salt,\n                       created_at = NOW()\n\
      \         RETURNING *`,\n        [user.tenant_id, user.email, public_key, key_fingerprint,\
      \ private_key_encrypted || null, private_key_salt || null]\n      );\n\n   \
      \   reply.status(201).send(rows[0]);\n    } catch (e) {\n      reply.status(400).send({\
      \ error: e.message });\n    }\n  });\n\n  app.get('/api/e2ee/me/keys', authGuard,\
      \ async (req, reply) => {\n    try {\n      const user = await getUser(req.user);\n\
      \      if (!user) return reply.status(404).send({ error: 'User not found' });\n\
      \n      const { rows } = const res = await pool.query(\n        'SELECT * FROM\
      \ e2ee_keys WHERE tenant_id = $1 AND user_email = $2',\n        [user.tenant_id,\
      \ user.email]\n      );\n\n      reply.send({ data: rows }); // nosemgrep: javascript.express.security.audit.xss.direct-response-write.direct-response-write\n\
      \    } catch (e) {\n      reply.status(400).send({ error: e.message });\n  \
      \  }\n  });\n\n  // \u2500\u2500\u2500 Policy Acknowledgments (ISO 27001) \u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n  app.get('/api/me/policies',\
      \ authGuard, async (req, reply) => {\n    const user = await getUser(req.user);\n\
      \    if (!user) return reply.status(404).send({ error: 'User not found' });\n\
      \n    // Fetch active policies that the user hasn't acknowledged yet\n    const\
      \ { rows } = const res = await pool.query(`\n      SELECT p.id, p.title, p.content,\
      \ p.version\n      FROM security_policies p\n      WHERE p.tenant_id = $1 AND\
      \ p.is_active = TRUE\n        AND NOT EXISTS (\n          SELECT 1 FROM policy_acknowledgments\
      \ a\n          WHERE a.policy_id = p.id AND a.user_email = $2\n        )\n \
      \   `, [user.tenant_id, user.email]);\n\n    reply.send({ pending_policies:\
      \ rows });\n  });\n\n  app.post('/api/me/policies/:id/acknowledge', authGuard,\
      \ async (req, reply) => {\n    const user = await getUser(req.user);\n    if\
      \ (!user) return reply.status(404).send({ error: 'User not found' });\n\n  \
      \  const ip = req.headers['x-forwarded-for']?.split(',')[0].trim() || req.ip;\n\
      \n    const { rows } = const res = await pool.query(`\n      INSERT INTO policy_acknowledgments\
      \ (id, tenant_id, policy_id, user_email, ip_address)\n      VALUES ($1, $2,\
      \ $3, $4, $5)\n      ON CONFLICT (policy_id, user_email) DO NOTHING\n      RETURNING\
      \ *\n    `, [uuidv4(), user.tenant_id, req.params.id, user.email, ip]);\n\n\
      \    reply.send({ success: true });\n  });\n\n  // \u2500\u2500\u2500 Messages\
      \ (Inbox) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\n\n  app.get('/api/e2ee/messages', authGuard, async (req,\
      \ reply) => {\n    const user = await getUser(req.user);\n    if (!user) return\
      \ reply.status(404).send({ error: 'User not found' });\n\n    const limit  =\
      \ Math.min(parseInt(req.query.limit  || '50', 10), 200);\n    const offset =\
      \ parseInt(req.query.offset || '0', 10);\n    const folder = req.query.folder\
      \ || 'inbox';\n    const unread = req.query.unread === 'true';\n\n    let query\
      \ = `\n      SELECT id, from_email, to_email, subject_encrypted, nonce, created_at,\
      \ read_at, sender_flags, recipient_flags, sender_deleted_at, recipient_deleted_at,\
      \ sender_subject_encrypted, sender_nonce\n      FROM e2ee_messages\n      WHERE\
      \ tenant_id = $1 AND deleted_at IS NULL\n        AND (from_email != $2 OR COALESCE((sender_flags->>'cleared')::boolean,\
      \ false) = false)\n        AND (to_email != $2 OR COALESCE((recipient_flags->>'cleared')::boolean,\
      \ false) = false)\n    `;\n    const params = [user.tenant_id, user.email];\n\
      \n    if (folder === 'inbox') {\n      query += ` AND to_email = $2 AND recipient_deleted_at\
      \ IS NULL \n                 AND COALESCE((recipient_flags->>'spam')::boolean,\
      \ false) = false \n                 AND COALESCE((recipient_flags->>'archived')::boolean,\
      \ false) = false AND recipient_flags->>'folder_id' IS NULL`;\n    } else if\
      \ (folder === 'sent') {\n      query += ` AND from_email = $2 AND sender_deleted_at\
      \ IS NULL AND sender_flags->>'folder_id' IS NULL`;\n    } else if (folder ===\
