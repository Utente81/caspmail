- apiVersion: v1
  data:
    soc.mjs: "import pool from '../db/pool.mjs';\nimport { encryptData, decryptData\
      \ } from '../services/vault.mjs';\nimport { requireRole } from '../auth/verify.mjs';\n\
      import { logSiemEvent } from '../audit/siem.mjs';\nimport { sendMail } from\
      \ '../mailer.mjs';\nconst SOC_ROLES = ['soc_analyst', 'soc_manager', 'soc_admin',\
      \ 'admin', 'casper_admin'];\nexport default async function socRoutes(app) {\n\
      \  const socGuard = { preHandler: requireRole(SOC_ROLES) };\n\nfunction zeroTrustGuardHook(req,\
      \ reply, done) {\n  const ip = req.headers['x-forwarded-for']?.split(',')[0].trim()\
      \ || req.ip || req.socket.remoteAddress || '';\n  const isVPN = /^10\\./.test(ip)\
      \ || /^192\\.168\\./.test(ip) || /^172\\.(1[6-9]|2[0-9]|3[0-1])\\./.test(ip)\
      \ || ip === '127.0.0.1' || ip === '::1';\n  \n  const now = new Date();\n  const\
      \ day = now.getUTCDay();\n  const hour = now.getUTCHours() + 2;\n  const isWorkingHours\
      \ = (day >= 1 && day <= 5) && (hour >= 8 && hour < 18);\n  \n  const acr = req.user?.acr;\n\
      \  const hasMFA = (acr === '2' || acr === 'loa2' || (req.user?.amr && req.user.amr.includes('mfa')));\n\
      \  \n  if (!isVPN && !isWorkingHours) {\n    if (!hasMFA) {\n      return reply.status(403).send({\
      \ error: 'Zero Trust Policy: Access denied. Please connect to VPN, operate during\
      \ working hours, or authenticate with MFA.' });\n    }\n  }\n  done();\n}\n\
      const zeroTrustGuard = { preHandler: [requireRole(SOC_ROLES), zeroTrustGuardHook]\
      \ };\n\n  const socStreamGuard = {\n    preHandler: async (req, reply) => {\n\
      \      if (!req.headers.authorization && req.query?.token) {\n        req.headers.authorization\
      \ = `Bearer ${req.query.token}`;\n      }\n      return requireRole(SOC_ROLES)(req,\
      \ reply);\n    },\n  };\n  async function getTenantId(req) {\n    const user\
      \ = req.user;\n    const { rows } = await pool.query(\n      'SELECT tenant_id\
      \ FROM users WHERE email = $1 LIMIT 1',\n      [user.email || user.preferred_username]\n\
      \    );\n    if (rows[0]?.tenant_id) return rows[0].tenant_id;\n    const roles\
      \ = user?.realm_access?.roles || user?.roles || [];\n    if (roles.some((role)\
      \ => ['admin', 'casper_admin'].includes(role))) {\n      return req.query?.tenant_id\
      \ || 'system';\n    }\n    return null;\n  }\n  // \u2500\u2500\u2500 Overview\
      \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  app.get('/overview',\
      \ socGuard, async (req, reply) => {\n    const tenantId = await getTenantId(req);\n\
      \    if (!tenantId) return reply.status(403).send({ error: 'No tenant association'\
      \ });\n    const [metrics, alerts, cases] = await Promise.all([\n      pool.query(`\n\
      \        SELECT\n          (SELECT COUNT(*) FROM soc_events WHERE tenant_id=$1\n\
      \           AND created_at > NOW() - INTERVAL '24 hours') AS events_24h,\n \
      \         (SELECT COUNT(*) FROM soc_events WHERE tenant_id=$1\n           AND\
      \ severity IN ('high','critical')\n           AND created_at > NOW() - INTERVAL\
      \ '24 hours') AS high_severity_24h,\n          (SELECT COUNT(*) FROM soc_alerts\
      \ WHERE tenant_id=$1 AND status='open') AS open_alerts,\n          (SELECT COUNT(*)\
      \ FROM soc_cases  WHERE tenant_id=$1 AND status='open') AS open_cases\n    \
      \  `, [tenantId]),\n      pool.query(`\n        SELECT a.id, a.severity, a.message,\
      \ a.status, a.created_at,\n               e.type AS event_type, e.source_ip\n\
      \        FROM soc_alerts a\n        LEFT JOIN soc_events e ON e.id = a.event_id\n\
      \        WHERE a.tenant_id = $1\n        ORDER BY a.created_at DESC LIMIT 10\n\
      \      `, [tenantId]),\n      pool.query(`\n        SELECT id, title, severity,\
      \ status, type, assigned_to, created_at\n        FROM soc_cases WHERE tenant_id\
      \ = $1\n        ORDER BY created_at DESC LIMIT 10\n      `, [tenantId]),\n \
      \   ]);\n    reply.send({\n      metrics: metrics.rows[0],\n      recent_alerts:\
      \ alerts.rows,\n      recent_cases: cases.rows,\n    });\n  });\n  // \u2500\
      \u2500\u2500 Alerts \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\n  app.get('/alerts', socGuard, async (req, reply) => {\n    const tenantId\
      \ = await getTenantId(req);\n    if (!tenantId) return reply.status(403).send({\
      \ error: 'No tenant association' });\n    const limit  = Math.min(parseInt(req.query.limit\
      \  || '50', 10), 200);\n    const offset = parseInt(req.query.offset || '0',\
      \ 10);\n    const status = req.query.status;\n    let query = `\n      SELECT\
      \ a.*, e.type AS event_type, e.source_ip, e.user_email AS event_user\n     \
      \ FROM soc_alerts a\n      LEFT JOIN soc_events e ON e.id = a.event_id\n   \
