      \ req/min per real IP   (broad protection)\n//  Auth endpoints:   20 req/min\
      \ per real IP   (brute-force mitigation)\n//  Write endpoints:  60 req/min per\
      \ real IP   (mutation protection)\n//\n// The keyGenerator always resolves the\
      \ real client IP even when behind nginx.\n\nfunction realIp(req) {\n  return\
      \ req.headers['x-real-ip'] || req.headers['x-forwarded-for']?.split(',')[0]?.trim()\
      \ || req.ip;\n}\n\nlet redisPassword;\ntry {\n  redisPassword = readFileSync('/run/secrets/redis_password',\
      \ 'utf8').trim();\n} catch {\n  console.warn('No redis password found at /run/secrets/redis_password');\n\
      }\n\nconst redis = new Redis({\n  host: process.env.REDIS_HOST || 'casper-redis-master.caspermail.svc.cluster.local',\n\
      \  port: parseInt(process.env.REDIS_PORT || '6379', 10),\n  password: process.env.REDIS_PASSWORD\
      \ || redisPassword\n});\n\n// Global rate-limit (applied to all routes via plugin)\n\
      await app.register(rateLimit, {\n  redis,\n  max: 200,\n  timeWindow: '1 minute',\n\
      \  keyGenerator: realIp,\n  errorResponseBuilder(_req, context) {\n    return\
      \ {\n      statusCode: 429,\n      error: 'Too Many Requests',\n      message:\
      \ `Rate limit exceeded. Try again in ${context.after}.`,\n    };\n  },\n});\n\
      \n// \u2500\u2500\u2500 Per-route rate-limit hooks \u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\n\n// Stricter limits for authentication-sensitive routes (e2ee\
      \ send, admin write ops)\nconst authRateLimit = {\n  config: {\n    rateLimit:\
      \ {\n      max: 20,\n      timeWindow: '1 minute',\n      keyGenerator: realIp,\n\
      \      errorResponseBuilder(_req, context) {\n        return {\n          statusCode:\
      \ 429,\n          error: 'Too Many Requests',\n          message: `Sensitive\
      \ endpoint rate limit exceeded. Try again in ${context.after}.`,\n        };\n\
      \      },\n    },\n  },\n};\n\n// Medium limit for mutating admin/SOC routes\n\
      const writeRateLimit = {\n  config: {\n    rateLimit: {\n      max: 60,\n  \
      \    timeWindow: '1 minute',\n      keyGenerator: realIp,\n    },\n  },\n};\n\
      \n// \u2500\u2500\u2500 Routes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\n\nawait app.register(healthRoutes);\n\
      await app.register(adminRoutes, { prefix: '/api/admin' });\nawait app.register(socRoutes,\
      \ { prefix: '/api/v4/soc' });\nawait app.register(socRoutes, { prefix: '/api/soc'\
      \ });\nawait app.register(mailRoutes, { rateLimitHooks: { authRateLimit, writeRateLimit\
      \ } });\nawait app.register(organizationRoutes, { rateLimitHooks: { authRateLimit,\
      \ writeRateLimit } });\nawait app.register(contactsRoutes, { rateLimitHooks:\
      \ { authRateLimit, writeRateLimit } });\n\n// \u2500\u2500\u2500 Global Error\
      \ Handler \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\n\napp.setErrorHandler((err, req, reply) => {\n  const statusCode\
      \ = err.statusCode || 500;\n  app.log.error({ err, url: sanitizedUrl(req.url),\
      \ method: req.method }, 'Request error');\n  reply.status(statusCode).send({\n\
      \    statusCode,\n    error: err.name || 'Error',\n    message: statusCode <\
      \ 500 ? err.message : 'Internal Server Error',\n  });\n});\n\n// \u2500\u2500\
      \u2500 Graceful Shutdown \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\nconst shutdown = async (signal)\
      \ => {\n  app.log.info({ signal }, 'Received shutdown signal, closing server...');\n\
      \  await app.close();\n  process.exit(0);\n};\n\nprocess.on('SIGTERM', () =>\
      \ shutdown('SIGTERM'));\nprocess.on('SIGINT',  () => shutdown('SIGINT'));\n\n\
      // \u2500\u2500\u2500 Startup \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\n\ntry {\n  app.log.info('Running database migrations...');\n\
      \  await runMigrations();\n  app.log.info('Migrations complete.');\n\n  await\
      \ app.listen({ port: PORT, host: HOST });\n  app.log.info(`CaspMail backend\
      \ listening on ${HOST}:${PORT}`);\n  \n  startSoarWorker(app);\n  startSimulator(app);\n\
      } catch (err) {\n  app.log.error(err, 'Fatal startup error');\n  process.exit(1);\n\
      }\n\nexport default app;\n"
