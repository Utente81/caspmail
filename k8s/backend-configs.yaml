      \          if (userEmail) {\n            await pool.query(\n              `UPDATE\
      \ users SET status = 'suspended' WHERE tenant_id = $1 AND email = $2`,\n   \
      \           [tenantId, userEmail]\n            );\n            result.log =\
      \ `Successfully suspended user ${userEmail}`;\n          } else {\n        \
      \    result.log = 'No user email provided in event data';\n          }\n   \
      \     } else {\n          result.log = `Unknown action type: ${playbook.action_type}`;\n\
      \          finalStatus = 'failure';\n        }\n      } catch (err) {\n    \
      \    console.error(`[SOAR] Error executing playbook ${playbook.id}:`, err);\n\
      \        result.log = `Error: ${err.message}`;\n        finalStatus = 'failure';\n\
      \      }\n\n      // Update run status\n      await pool.query(\n        `UPDATE\
      \ soar_runs SET status = $1, result = $2, completed_at = NOW() WHERE id = $3`,\n\
      \        [finalStatus, JSON.stringify(result), runId]\n      );\n\n      //\
