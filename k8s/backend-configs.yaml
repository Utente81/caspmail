    siem.mjs: "import crypto from 'crypto';\nimport pool from '../db/pool.mjs';\n\n\
      const SIEM_SECRET = process.env.SIEM_SECRET || crypto.randomBytes(32).toString('hex');\n\
      \n/**\n * Logs a high-value security or compliance event to the SIEM via stdout\
      \ and Webhook.\n * The log is cryptographically signed to guarantee immutability.\n\
      \ * \n * @param {string} tenantId - The ID of the tenant.\n * @param {string}\
      \ actor - The user (email or ID) performing the action.\n * @param {string}\
      \ action - The action type (e.g. 'read_mail', 'export_data', 'click_threat').\n\
      \ * @param {string} resource - The target resource (e.g. message ID, alert ID).\n\
      \ * @param {object} details - Additional structured JSON details.\n * @param\
      \ {string} ip - IP address of the actor.\n */\nexport async function logSiemEvent({\
      \ tenantId, actor, action, resource, details, ip }) {\n  const timestamp = new\
      \ Date().toISOString();\n  \n  const payload = {\n    tenant_id: tenantId,\n\
      \    timestamp,\n    actor,\n    action,\n    resource,\n    details: details\
      \ || {},\n    ip: ip || 'unknown'\n  };\n\n  // Create HMAC signature to prove\
      \ the log wasn't tampered with\n  const signature = crypto.createHmac('sha256',\
      \ SIEM_SECRET)\n                          .update(JSON.stringify(payload))\n\
      \                          .digest('hex');\n  \n  const logEntry = {\n    ...payload,\n\
      \    _signature: signature,\n    _source: 'caspermail-backend'\n  };\n\n  //\
      \ Emit to stdout in structured JSON format for log forwarders (e.g. Fluentd,\
      \ Promtail, Filebeat)\n  console.log(JSON.stringify({ SIEM_EVENT: logEntry }));\n\
      \n  // Push to external SIEM if configured\n  try {\n    if (!tenantId) return;\n\
      \    const { rows } = await pool.query(\n      `SELECT url, auth_token, format\
      \ FROM soc_siem_endpoints WHERE tenant_id = $1 AND is_active = true`,\n    \
      \  [tenantId]\n    );\n\n    for (const config of rows) {\n      const headers\
      \ = { 'Content-Type': 'application/json' };\n      if (config.auth_token) {\n\
      \        headers['Authorization'] = `Bearer ${config.auth_token}`;\n      }\n\
      \n      let bodyPayload = logEntry;\n      if (config.format === 'cef') {\n\
      \        // Convert to Common Event Format (CEF) roughly\n        bodyPayload\
      \ = `CEF:0|CaspMail|Backend|1.0|${action}|${action}|5|msg=${JSON.stringify(details)}\
      \ suser=${actor} src=${ip}`;\n      } else {\n        bodyPayload = JSON.stringify(logEntry);\n\
      \      }\n\n      // Fire and forget\n      fetch(config.url, {\n        method:\
      \ 'POST',\n        headers,\n        body: typeof bodyPayload === 'string' ?\
      \ bodyPayload : JSON.stringify(bodyPayload)\n      }).catch(err => console.error(`SIEM\
      \ webhook push failed for ${config.url}:`, err.message));\n    }\n  } catch\
      \ (err) {\n    console.error(\"Failed to query SIEM endpoints:\", err);\n  }\n\
      }\n\n"
