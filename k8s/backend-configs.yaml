      \ SET last_run_at = NOW(), last_run_status = $1 WHERE id = $2`,\n        [finalStatus,\
      \ playbook.id]\n      );\n    }\n  } catch (err) {\n    console.error(`[SOAR]\
      \ Error processing playbooks for ${triggerType}:`, err);\n  }\n}\n"
