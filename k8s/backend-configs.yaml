      \    let count = 0;\n      for (const k of keys) {\n        if (!k.prekey_id\
      \ || !k.public_key || !k.private_key_encrypted) continue;\n        const wrappedPrivate\
      \ = await wrapKey(k.private_key_encrypted);\n        await pool.query(\n   \
      \       `INSERT INTO e2ee_prekeys (id, tenant_id, user_email, prekey_id, public_key,\
      \ private_key_encrypted, escrow_data, escrow_aes, escrow_iv)\n           VALUES\
      \ ($1, $2, $3, $4, $5, $6, $7, $8, $9) ON CONFLICT DO NOTHING`,\n          [uuidv4(),\
      \ user.tenant_id, user.email, k.prekey_id, k.public_key, wrappedPrivate, k.escrow_data\
