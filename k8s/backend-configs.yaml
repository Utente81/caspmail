    mail.mjs: "import { v4 as uuidv4 } from 'uuid';\nimport pool from '../db/pool.mjs';\n\
      import { requireAuth } from '../auth/verify.mjs';\nimport { logSiemEvent } from\
      \ '../audit/siem.mjs';\n\nconst authGuard = { preHandler: requireAuth };\nconst\
      \ VAULT_ADDR = process.env.VAULT_ADDR || 'http://casper-vault.caspermail.svc.cluster.local:8200';\n\
      const VAULT_TOKEN = process.env.VAULT_TOKEN;\n\nasync function wrapKey(plaintext)\
      \ {\n  if (!VAULT_TOKEN) throw new Error(\"Vault Token missing\");\n  const\
      \ res = await fetch(`${VAULT_ADDR}/v1/transit/encrypt/caspmail-kek`, {\n   \
      \ method: 'POST',\n    headers: { 'X-Vault-Token': VAULT_TOKEN, 'Content-Type':\
      \ 'application/json' },\n    body: JSON.stringify({ plaintext: Buffer.from(plaintext).toString('base64')\
      \ })\n  });\n  if (!res.ok) throw new Error(\"Vault wrap failed\");\n  const\
      \ data = await res.json();\n  return data.data.ciphertext;\n}\n\nasync function\
      \ unwrapKey(ciphertext) {\n  if (!VAULT_TOKEN) throw new Error(\"Vault Token\
      \ missing\");\n  const res = await fetch(`${VAULT_ADDR}/v1/transit/decrypt/caspmail-kek`,\
      \ {\n    method: 'POST',\n    headers: { 'X-Vault-Token': VAULT_TOKEN, 'Content-Type':\
      \ 'application/json' },\n    body: JSON.stringify({ ciphertext })\n  });\n \
      \ if (!res.ok) throw new Error(\"Vault unwrap failed\");\n  const data = await\
      \ res.json();\n  return Buffer.from(data.data.plaintext, 'base64').toString('utf8');\n\
      }\n\nexport default async function mailRoutes(app) {\n  // Helper: look up user\
      \ row from JWT email\n  async function getUser(jwtPayload) {\n    let email\
      \ = jwtPayload.email || jwtPayload.preferred_username || jwtPayload.sub;\n \
      \   if (!email) throw new Error(\"Missing email, username and sub in JWT\");\n\
      \n    let { rows } = await pool.query(\n      'SELECT * FROM users WHERE email\
      \ = $1 LIMIT 1',\n      [email]\n    );\n\n    if (rows.length === 0) {\n  \
      \    const name = jwtPayload.name || email.split('@')[0];\n      const tenant\
      \ = 'caspmail';\n      try {\n        const res = await pool.query(\n      \
      \    `INSERT INTO users (tenant_id, email, name, quota_mb) VALUES ($1, $2, $3,\
      \ 500) RETURNING *`,\n          [tenant, email, name]\n        );\n        rows\
      \ = res.rows;\n      } catch (e) {\n        throw new Error(\"AUTO_PROVISION_FAIL:\
      \ \" + e.message + \" | email: \" + email);\n      }\n    }\n    \n    if (!rows[0])\
      \ throw new Error(\"User row is empty after insert\");\n    return rows[0];\n\
      \  }\n\n  // \u2500\u2500\u2500 Current User \u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n\
      \  app.get('/api/discovery/:domain', async (req, reply) => {\n    const { domain\
      \ } = req.params;\n    \n    // Check if domain exists in domains table and\
      \ get tenant\n    const { rows: domainRows } = await pool.query('SELECT tenant_id\
      \ FROM domains WHERE domain = $1', [domain]);\n    \n    if (domainRows.length\
      \ > 0) {\n      const tenantId = domainRows[0].tenant_id;\n      // Get mobile\
      \ policies\n      const { rows: policyRows } = await pool.query('SELECT * FROM\
      \ tenant_mobile_policies WHERE tenant_id = $1', [tenantId]);\n      \n     \
      \ const policies = policyRows.length > 0 ? policyRows[0] : { require_biometrics:\
      \ false, prevent_screenshots: false };\n      \n      return reply.send({\n\
      \        type: 'enterprise',\n        tenantId,\n        requireBiometrics:\
      \ policies.require_biometrics,\n        preventScreenshots: policies.prevent_screenshots,\n\
      \        oidcIssuer: `https://auth.enterprise.caspmail.com/realms/${tenantId}`\n\
      \      });\n    }\n\n    // Default response for caspmail.com or unknown\n \
      \   reply.send({\n      type: 'standard',\n      apiUrl: 'https://api.caspmail.com'\n\
      \    });\n  });\n\n  app.get('/api/me', authGuard, async (req, reply) => {\n\
      \    const user = await getUser(req.user);\n    if (!user) return reply.status(404).send({\
      \ error: 'User not found' });\n    reply.send(user); // nosemgrep: javascript.express.security.audit.xss.direct-response-write.direct-response-write\n\
      \  });\n\n  app.get('/api/me/dashboard', authGuard, async (req, reply) => {\n\
      \    const user = await getUser(req.user);\n    if (!user) return reply.status(404).send({\
      \ error: 'User not found' });\n\n    const [inbox, keys, storage] = await Promise.all([\n\
      \      pool.query(`\n        SELECT COUNT(*) AS total,\n               COUNT(*)\
      \ FILTER (WHERE read_at IS NULL) AS unread\n        FROM e2ee_messages\n   \
      \     WHERE tenant_id = $1 AND to_email = $2 AND deleted_at IS NULL AND recipient_deleted_at\
      \ IS NULL\n          AND COALESCE((recipient_flags->>'spam')::boolean, false)\
      \ = false\n          AND COALESCE((recipient_flags->>'archived')::boolean, false)\
      \ = false\n      `, [user.tenant_id, user.email]),\n      pool.query(`\n   \
      \     SELECT key_fingerprint, created_at\n        FROM e2ee_keys\n        WHERE\
      \ tenant_id = $1 AND user_email = $2\n        LIMIT 1\n      `, [user.tenant_id,\
      \ user.email]),\n      pool.query(`\n        SELECT\n          COUNT(*) AS message_count,\n\
      \          COALESCE(SUM(\n            octet_length(COALESCE(subject_encrypted,''))\
      \ +\n            octet_length(COALESCE(body_encrypted,'')) +\n            octet_length(COALESCE(nonce,''))\n\
      \          ), 0) AS bytes_used\n        FROM e2ee_messages\n        WHERE tenant_id\
      \ = $1 AND to_email = $2 AND deleted_at IS NULL\n      `, [user.tenant_id, user.email]),\n\
      \    ]);\n\n    const bytesUsed = Number(storage.rows[0]?.bytes_used || 0);\n\
      \    const mbUsed    = Math.round(bytesUsed / 1024 / 1024 * 100) / 100;\n  \
      \  const quotaMb   = user.quota_mb || 100;\n\n    reply.send({\n      user,\n\
      \      inbox: inbox.rows[0],\n      has_keys: keys.rows.length > 0,\n      key_fingerprint:\
      \ keys.rows[0]?.key_fingerprint || null,\n      storage: {\n        used_mb:\
      \    mbUsed,\n        quota_mb:   quotaMb,\n        used_pct:   Math.min(100,\
      \ Math.round((mbUsed / quotaMb) * 100)),\n        bytes_used: bytesUsed,\n \
      \     },\n    });\n  });\n\n  // \u2500\u2500\u2500 E2EE Keys \u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
