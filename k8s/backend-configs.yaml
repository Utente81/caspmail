      \ keycloakUser.id;\n}\n\nasync function deleteKeycloakUser(email) {\n  const\
      \ token = await keycloakAdminToken();\n  const keycloakUser = await findKeycloakUser(token,\
      \ email);\n  if (!keycloakUser) return; // already deleted\n\n  const headers\
      \ = { Authorization: `Bearer ${token}` };\n  const res = await fetch(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUser.id}`,\n\
      \    { method: 'DELETE', headers }\n  );\n  if (!res.ok) {\n    const text =\
      \ await res.text().catch(() => '');\n    throw new Error(`Keycloak delete failed\
      \ ${res.status}: ${text}`);\n  }\n}\n\nasync function getTenantId(req) {\n \
      \ let tenantId = req.headers['x-tenant-id'] || req.user?.tenant;\n  if (!tenantId\
      \ && (req.user?.email || req.user?.preferred_username)) {\n    const email =\
      \ req.user.email || req.user.preferred_username;\n    const { rows } = await\
      \ pool.query('SELECT tenant_id FROM users WHERE email = $1', [email]);\n   \
      \ if (rows.length > 0) tenantId = rows[0].tenant_id;\n  }\n  return tenantId;\n\
      }\n\nexport default async function adminRoutes(app) {\n  const adminGuard =\
      \ { preHandler: requireRole(ADMIN_ROLES) };\n\n  // \u2500\u2500\u2500 Summary\
      \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n\n  app.get('/summary',\
      \ adminGuard, async (req, reply) => {\n    const { rows } = await pool.query(`\n\
      \      SELECT\n        (SELECT COUNT(*) FROM tenants WHERE status = 'active')\
      \        AS active_tenants,\n        (SELECT COUNT(*) FROM users WHERE COALESCE(status,\
      \ 'active') <> 'deleted') AS total_users,\n        (SELECT COUNT(*) FROM domains\
      \ WHERE verified = TRUE)          AS verified_domains,\n        (SELECT COUNT(*)\
      \ FROM soc_alerts WHERE status = 'open')       AS open_alerts,\n        (SELECT\
      \ COUNT(*) FROM soc_cases  WHERE status = 'open')       AS open_cases\n    `);\n\
      \    reply.send(rows[0]); // nosemgrep: javascript.express.security.audit.xss.direct-response-write.direct-response-write\n\
      \  });\n\n  // \u2500\u2500\u2500 Metrics & Retention \u2500\u2500\u2500\u2500\
      \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
