        \uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\
        \uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\U0001F6E1\
        \uFE0F\U0001F6E1\uFE0F\U0001F6E1\uFE0F\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\\n\\n  app.get('/audit', adminGuard, async (req, reply) =\\u003e\
        \ {\\n    const limit  = Math.min(parseInt(req.query.limit  || '100', 10),\
        \ 500);\\n    const offset = parseInt(req.query.offset || '0', 10);\\n   \
        \ const search = req.query.search?.trim();\\n    const since  = req.query.since;\\\
        n\\n    let query = 'SELECT * FROM audit_log WHERE 1=1';\\n    const params\
        \ = [];\\n\\n    const userRoles = req.user?.realm_access?.roles || [];\\\
        n    const isGlobalAdmin = userRoles.includes('casper_admin');\\n\\n    if\
        \ (!isGlobalAdmin) {\\n      let tenantId = req.headers['x-tenant-id'] ||\
        \ req.user?.tenant;\\n      if (!tenantId \\u0026\\u0026 (req.user?.email\
        \ || req.user?.preferred_username)) {\\n        const email = req.user.email\
        \ || req.user.preferred_username;\\n        const { rows } = await pool.query('SELECT\
        \ tenant_id FROM users WHERE email = $1', [email]);\\n        if (rows.length\
        \ \\u003e 0) tenantId = rows[0].tenant_id;\\n      }\\n      if (!tenantId)\
        \ return reply.status(403).send({ error: 'No tenant association' });\\n  \
        \    params.push(tenantId);\\n      query += ` AND tenant_id = $${params.length}`;\\\
        n    } else if (req.query.tenant_id) {\\n      params.push(req.query.tenant_id);\\\
        n      query += ` AND tenant_id = $${params.length}`;\\n    }\\n\\n    if\
        \ (search) {\\n      params.push(`%${search}%`);\\n      query += ` AND (actor\
        \ ILIKE $${params.length} OR action ILIKE $${params.length} OR resource ILIKE\
        \ $${params.length})`;\\n    }\\n\\n    if (since) {\\n      const intervalMap\
        \ = { '1h': '1 hour', '24h': '24 hours', '7d': '7 days', '30d': '30 days'\
        \ };\\n      const interval = intervalMap[since];\\n      if (interval) {\\\
        n        query += ` AND created_at \\u003e NOW() - INTERVAL '${interval}'`;\\\
        n      }\\n    }\\n\\n    params.push(limit, offset);\\n    query += ` ORDER\
        \ BY created_at DESC LIMIT $${params.length - 1} OFFSET $${params.length}`;\\\
        n\\n    const { rows } = await pool.query(query, params);\\n    reply.send({\
        \ data: rows, limit, offset });\\n  });\\n}\\n\"},\"kind\":\"ConfigMap\",\"\
        metadata\":{\"annotations\":{},\"name\":\"backend-patch-admin\",\"namespace\"\
        :\"caspermail\"}}\n"
