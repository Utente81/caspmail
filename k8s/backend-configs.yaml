      \ = 'active'`,\n      [tenantId, triggerType]\n    );\n\n    for (const playbook\
      \ of playbooks) {\n      // Create a pending run\n      const { rows: runRows\
      \ } = await pool.query(\n        `INSERT INTO soar_runs (playbook_id, tenant_id,\
      \ trigger_type, status)\n         VALUES ($1, $2, $3, 'running') RETURNING id`,\n\
      \        [playbook.id, tenantId, triggerType]\n      );\n      const runId =\
      \ runRows[0].id;\n\n      let result = { log: 'Playbook started' };\n      let\
      \ finalStatus = 'success';\n\n      try {\n        if (playbook.action_type\
      \ === 'block_ip') {\n          // Add IP to blocked list\n          const ip\
      \ = eventData.source_ip;\n          if (ip) {\n            await pool.query(\n\
      \              `INSERT INTO soc_blocked_ips (tenant_id, ip_address, reason,\
      \ expires_at)\n               VALUES ($1, $2, $3, NOW() + INTERVAL '24 hours')\
      \ ON CONFLICT DO NOTHING`,\n              [tenantId, ip, `Automated block by\
      \ SOAR Playbook: ${playbook.name}`]\n            );\n            result.log\
      \ = `Successfully blocked IP ${ip}`;\n          } else {\n            result.log\
      \ = 'No source IP provided in event data';\n          }\n        } else if (playbook.action_type\
