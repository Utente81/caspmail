      \ = private_key_encrypted || null;\n      if (finalEncryptedKey) {\n       \
      \ finalEncryptedKey = await wrapKey(finalEncryptedKey);\n      }\n\n      const\
      \ { rows } = await pool.query(\n        `INSERT INTO e2ee_keys (tenant_id, user_email,\
      \ public_key, key_fingerprint, private_key_encrypted, private_key_salt, escrow_data,\
      \ escrow_aes, escrow_iv)\n         VALUES ($1, $2, $3, $4, $5, $6, $7, $8, $9)\n\
