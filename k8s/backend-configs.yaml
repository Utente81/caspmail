      \    } catch (e) {\n      reply.status(400).send({ error: e.message });\n  \
      \  }\n  });\n\n  app.get('/api/e2ee/corporate-key', authGuard, async (req, reply)\
      \ => {\n    try {\n      const user = await getUser(req.user);\n      const\
      \ { rows } = await pool.query('SELECT public_key FROM corporate_master_keys\
      \ WHERE tenant_id = $1', [user.tenant_id]);\n      if (rows.length === 0) return\
      \ reply.status(404).send({ error: 'Corporate Master Key not found' });\n   \
      \   reply.send(rows[0]);\n    } catch(e) {\n      reply.status(400).send({ error:\
