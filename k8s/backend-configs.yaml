- apiVersion: v1
  data:
    pool.mjs: "import pg from 'pg';\n\nconst { Pool } = pg;\n\nconst VAULT_ADDR =\
      \ process.env.VAULT_ADDR || 'http://casper-vault.caspermail.svc.cluster.local:8200';\n\
      const VAULT_TOKEN = process.env.VAULT_TOKEN;\n\nlet cachedPassword = null;\n\
      let passwordExpiresAt = 0;\n\nasync function fetchDynamicPassword() {\n  if\
      \ (cachedPassword && Date.now() < passwordExpiresAt) {\n    return cachedPassword;\n\
      \  }\n\n  if (!VAULT_TOKEN) {\n    throw new Error('VAULT_TOKEN is missing.\
      \ Cannot fetch dynamic DB credentials.');\n  }\n\n  try {\n    const res = await\
      \ fetch(`${VAULT_ADDR}/v1/database/static-creds/backend-role`, {\n      headers:\
      \ { 'X-Vault-Token': VAULT_TOKEN }\n    });\n    \n    if (!res.ok) {\n    \
      \  throw new Error(`Vault returned ${res.status}: ${await res.text()}`);\n \
      \   }\n\n    const data = await res.json();\n    cachedPassword = data.data.password;\n\
      \    // Cache for 5 minutes (Vault rotates every 15m)\n    passwordExpiresAt\
      \ = Date.now() + (5 * 60 * 1000); \n    \n    console.log('[pg pool] Successfully\
      \ fetched dynamic password from Vault');\n    return cachedPassword;\n  } catch\
      \ (error) {\n    console.error('[pg pool] Failed to fetch dynamic password:',\
      \ error);\n    throw error;\n  }\n}\n\nconst host = process.env.DB_HOST || 'postgres';\n\
      const port = process.env.DB_PORT || '5432';\nconst db   = process.env.DB_NAME\
      \ || 'caspermail';\nconst user = 'casper_backend';\n\nconst pool = new Pool({\n\
      \  host,\n  port,\n  database: db,\n  user,\n  password: fetchDynamicPassword,\n\
      \  max: 20,\n  idleTimeoutMillis: 30_000,\n  connectionTimeoutMillis: 5_000,\n\
      \  ssl: process.env.DATABASE_SSL === 'true' ? { rejectUnauthorized: false }\
      \ : false,\n});\n\npool.on('error', (err) => {\n  console.error('[pg pool] Unexpected\
      \ client error', err);\n});\n\nexport async function withTransaction(fn) {\n\
      \  const client = await pool.connect();\n  try {\n    await client.query('BEGIN');\n\
      \    const result = await fn(client);\n    await client.query('COMMIT');\n \
      \   return result;\n  } catch (err) {\n    await client.query('ROLLBACK');\n\
      \    throw err;\n  } finally {\n    client.release();\n  }\n}\n\nexport default\
      \ pool;\n"
  kind: ConfigMap
