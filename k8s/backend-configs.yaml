    verify.mjs: "import { createRemoteJWKSet, jwtVerify } from 'jose';\n\nconst JWKS_URI\
      \ = process.env.KEYCLOAK_JWKS_URI;\nconst ISSUER = process.env.KEYCLOAK_ISSUER;\n\
      \nif (!JWKS_URI) throw new Error('KEYCLOAK_JWKS_URI env var is required');\n\
      if (!ISSUER) throw new Error('KEYCLOAK_ISSUER env var is required');\n\n// Cache\
      \ JWKS remotely \u2014 jose handles automatic rotation\nconst JWKS = createRemoteJWKSet(new\
      \ URL(JWKS_URI));\n\n/**\n * Verify the Bearer token from Authorization header.\n\
      \ * Returns the decoded JWT payload or throws on failure.\n *\n * @param {import('fastify').FastifyRequest}\
      \ req\n * @returns {Promise<object>} JWT payload\n */\nexport async function\
      \ verifyToken(req) {\n  const authHeader = req.headers.authorization;\n  if\
      \ (!authHeader || !authHeader.startsWith('Bearer ')) {\n    const err = new\
      \ Error('Missing or malformed Authorization header');\n    err.statusCode =\
      \ 401;\n    throw err;\n  }\n\n  const token = authHeader.slice(7);\n\n  try\
      \ {\n    const { payload } = await jwtVerify(token, JWKS, {\n      issuer: ISSUER,\n\
      \      algorithms: ['RS256'],\n    });\n    return payload;\n  } catch (cause)\
      \ {\n    const err = new Error('Invalid or expired token');\n    err.statusCode\
      \ = 401;\n    err.cause = cause;\n    throw err;\n  }\n}\n\n/**\n * Verify a\
      \ raw JWT token string (e.g. for Socket.io auth).\n *\n * @param {string} token\n\
      \ * @returns {Promise<object>} JWT payload\n */\nexport async function verifySocketToken(token)\
      \ {\n  try {\n    const { payload } = await jwtVerify(token, JWKS, {\n     \
      \ issuer: ISSUER,\n      algorithms: ['RS256'],\n    });\n    return payload;\n\
      \  } catch (cause) {\n    throw new Error('Invalid or expired socket token');\n\
      \  }\n}\n\n/**\n * Fastify preHandler factory that enforces role-based access.\n\
      \ * Attaches the verified JWT payload to req.user.\n *\n * @param {string[]}\
      \ roles - At least one of these realm_access.roles must be present\n * @returns\
      \ {import('fastify').preHandlerHookHandler}\n */\nexport function requireRole(roles)\
      \ {\n  return async function roleCheck(req, reply) {\n    let payload;\n   \
      \ try {\n      payload = await verifyToken(req);\n    } catch (err) {\n    \
      \  reply.status(err.statusCode || 401).send({ error: err.message });\n     \
      \ return;\n    }\n\n    req.user = payload;\n\n    const userRoles = payload?.realm_access?.roles\
      \ || [];\n    const hasRole = roles.some((r) => userRoles.includes(r));\n\n\
      \    if (!hasRole) {\n      reply.status(403).send({\n        error: 'Forbidden',\n\
      \        message: `Required role(s): ${roles.join(', ')}`,\n      });\n    \
      \  return reply;\n    }\n  };\n}\n\n/**\n * Fastify preHandler that only verifies\
      \ the token (no role check).\n * Attaches payload to req.user.\n */\nexport\
      \ async function requireAuth(req, reply) {\n  try {\n    req.user = await verifyToken(req);\n\
      \  } catch (err) {\n    reply.status(err.statusCode || 401).send({ error: err.message\
      \ });\n    return reply;\n  }\n}\n"
