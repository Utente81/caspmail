    admin.mjs: "import { v4 as uuidv4 } from 'uuid';\nimport { readFileSync } from\
      \ 'fs';\nimport pool from '../db/pool.mjs';\nimport { requireRole } from '../auth/verify.mjs';\n\
      \nconst ADMIN_ROLES = ['admin', 'casper_admin'];\nconst MANAGED_REALM_ROLES\
      \ = ['user', 'admin', 'soc_analyst', 'soc_manager'];\nconst KEYCLOAK_INTERNAL_URL\
      \ = process.env.KEYCLOAK_INTERNAL_URL || 'http://keycloak:8080';\nconst KEYCLOAK_REALM\
      \ = process.env.KEYCLOAK_REALM || 'caspermail';\nconst KEYCLOAK_ADMIN_USER =\
      \ process.env.KEYCLOAK_ADMIN_USER || 'admin';\nconst KEYCLOAK_ADMIN_PASSWORD_FILE\
      \ = process.env.KEYCLOAK_ADMIN_PASSWORD_FILE || '/run/secrets/keycloak_admin_password';\n\
      \nfunction keycloakAdminPassword() {\n  return readFileSync(KEYCLOAK_ADMIN_PASSWORD_FILE,\
      \ 'utf8').trim();\n}\n\nasync function keycloakJson(url, options = {}) {\n \
      \ const res = await fetch(url, options);\n  if (!res.ok) {\n    const text =\
      \ await res.text().catch(() => '');\n    throw new Error(`Keycloak ${res.status}:\
      \ ${text || res.statusText}`);\n  }\n  if (res.status === 204) return null;\n\
      \  const text = await res.text();\n  return text ? JSON.parse(text) : null;\n\
      }\n\nasync function keycloakAdminToken() {\n  const body = new URLSearchParams({\n\
      \    grant_type: 'password',\n    client_id: 'admin-cli',\n    username: KEYCLOAK_ADMIN_USER,\n\
      \    password: keycloakAdminPassword(),\n  });\n\n  const data = await keycloakJson(`${KEYCLOAK_INTERNAL_URL}/realms/master/protocol/openid-connect/token`,\
      \ {\n    method: 'POST',\n    headers: { 'Content-Type': 'application/x-www-form-urlencoded'\
      \ },\n    body,\n  });\n\n  return data.access_token;\n}\n\nasync function findKeycloakUser(token,\
      \ email) {\n  const users = await keycloakJson(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users?email=${encodeURIComponent(email)}&exact=true`,\n\
      \    { headers: { Authorization: `Bearer ${token}` } }\n  );\n  return users?.find((user)\
      \ => user.username === email || user.email === email) || null;\n}\n\nasync function\
      \ setKeycloakUserRole(token, keycloakUserId, roleName) {\n  const headers =\
      \ { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };\n\
      \  const role = await keycloakJson(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/roles/${encodeURIComponent(roleName)}`,\n\
      \    { headers }\n  );\n  const currentRoles = await keycloakJson(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUserId}/role-mappings/realm`,\n\
      \    { headers }\n  );\n  const managedCurrentRoles = currentRoles.filter((currentRole)\
      \ => MANAGED_REALM_ROLES.includes(currentRole.name));\n\n  if (managedCurrentRoles.length)\
      \ {\n    await keycloakJson(\n      `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUserId}/role-mappings/realm`,\n\
      \      { method: 'DELETE', headers, body: JSON.stringify(managedCurrentRoles)\
      \ }\n    );\n  }\n\n  await keycloakJson(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUserId}/role-mappings/realm`,\n\
      \    { method: 'POST', headers, body: JSON.stringify([role]) }\n  );\n}\n\n\
      async function provisionKeycloakUser({ email, name, role, password, enabled\
      \ = true }) {\n  const token = await keycloakAdminToken();\n  const headers\
      \ = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };\n\
      \  let keycloakUser = await findKeycloakUser(token, email);\n\n  if (!keycloakUser)\
      \ {\n    const createRes = await fetch(`${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users`,\
      \ {\n      method: 'POST',\n      headers,\n      body: JSON.stringify({\n \
      \       username: email,\n        email,\n        firstName: name || email,\n\
      \        enabled,\n        emailVerified: true,\n      }),\n    });\n    if\
      \ (!createRes.ok) {\n      const text = await createRes.text().catch(() => '');\n\
      \      throw new Error(`Keycloak ${createRes.status}: ${text || createRes.statusText}`);\n\
      \    }\n    keycloakUser = await findKeycloakUser(token, email);\n  } else {\n\
      \    await keycloakJson(\n      `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUser.id}`,\n\
      \      {\n        method: 'PUT',\n        headers,\n        body: JSON.stringify({\n\
      \          ...keycloakUser,\n          email,\n          firstName: name ||\
      \ email,\n          enabled,\n          emailVerified: true,\n        }),\n\
      \      }\n    );\n  }\n\n  if (!keycloakUser?.id) throw new Error('Keycloak\
      \ user provisioning failed');\n\n  if (password) {\n    await keycloakJson(\n\
      \      `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUser.id}/reset-password`,\n\
      \      {\n        method: 'PUT',\n        headers,\n        body: JSON.stringify({\
      \ type: 'password', value: password, temporary: false }),\n      }\n    );\n\
      \  }\n\n  await setKeycloakUserRole(token, keycloakUser.id, role);\n  return\
      \ keycloakUser.id;\n}\n\nasync function syncKeycloakUserStatus({ email, name,\
      \ role, status }) {\n  return await provisionKeycloakUser({ email, name, role,\
      \ enabled: status === 'active' });\n}\n\nasync function resetKeycloakUserPassword({\
      \ email, password }) {\n  if (!password) return null;\n\n  const token = await\
      \ keycloakAdminToken();\n  const keycloakUser = await findKeycloakUser(token,\
      \ email);\n  if (!keycloakUser) throw new Error('Keycloak user not found');\n\
      \n  const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json'\
      \ };\n  await keycloakJson(\n    `${KEYCLOAK_INTERNAL_URL}/admin/realms/${KEYCLOAK_REALM}/users/${keycloakUser.id}/reset-password`,\n\
      \    {\n      method: 'PUT',\n      headers,\n      body: JSON.stringify({ type:\
      \ 'password', value: password, temporary: false }),\n    }\n  );\n\n  return\
      \ keycloakUser.id;\n}\n\nasync function getTenantId(req) {\n  let tenantId =\
      \ req.headers['x-tenant-id'] || req.user?.tenant;\n  if (!tenantId && (req.user?.email\
      \ || req.user?.preferred_username)) {\n    const email = req.user.email || req.user.preferred_username;\n\
      \    const { rows } = await pool.query('SELECT tenant_id FROM users WHERE email\
      \ = $1', [email]);\n    if (rows.length > 0) tenantId = rows[0].tenant_id;\n\
      \  }\n  return tenantId;\n}\n\nexport default async function adminRoutes(app)\
      \ {\n  const adminGuard = { preHandler: requireRole(ADMIN_ROLES) };\n\n  //\
