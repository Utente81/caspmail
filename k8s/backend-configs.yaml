        \ email = $1', [email])\\n      .then(({rows}) =\\u003e {\\n        if (rows.length\
        \ \\u003e 0) {\\n          pool.query(`\\n            INSERT INTO assets (id,\
        \ tenant_id, ip_address, device_type, last_seen)\\n            VALUES ($1,\
        \ $2, $3, $4, NOW())\\n            ON CONFLICT (tenant_id, ip_address)\\n\
        \            DO UPDATE SET last_seen = NOW(), device_type = $4\\n        \
        \  `, [uuidv4(), rows[0].tenant_id, ip, ua]).catch(()=\\u003e{});\\n     \
        \   }\\n      }).catch(()=\\u003e{});\\n  }\\n  done();\\n});\\n\\n// Global\
        \ rate-limit (applied to all routes via plugin)\\nawait app.register(rateLimit,\
        \ {\\n  max: 100,\\n  timeWindow: '1 minute',\\n  keyGenerator: realIp,\\\
        n  errorResponseBuilder(req, context) {\\n    const ip = realIp(req);\\n \
        \   logWafEvent(ip, 'rate_limit', 'high', 'Global Rate Limit Exceeded (Possible\
        \ DoS)', 'T1498');\\n    return {\\n      statusCode: 429,\\n      error:\
        \ 'Too Many Requests',\\n      message: `Rate limit exceeded. Try again in\
        \ ${context.after}.`,\\n    };\\n  },\\n});\\n\\n// \u2500\u2500\u2500 Per-route\
        \ rate-limit hooks \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\\n\\n// Stricter\
        \ limits for authentication-sensitive routes (e2ee send, admin write ops)\\\
        nconst authRateLimit = {\\n  config: {\\n    rateLimit: {\\n      max: 10,\\\
        n      timeWindow: '1 minute',\\n      keyGenerator: realIp,\\n      errorResponseBuilder(req,\
        \ context) {\\n        const ip = realIp(req);\\n        logWafEvent(ip, 'rate_limit_auth',\
        \ 'critical', 'Auth Rate Limit Exceeded (Brute-Force)', 'T1110');\\n     \
        \   return {\\n          statusCode: 429,\\n          error: 'Too Many Requests',\\\
        n          message: `Sensitive endpoint rate limit exceeded. Try again in\
        \ ${context.after}.`,\\n        };\\n      },\\n    },\\n  },\\n};\\n\\n//\
        \ Medium limit for mutating admin/SOC routes\\nconst writeRateLimit = {\\\
        n  config: {\\n    rateLimit: {\\n      max: 60,\\n      timeWindow: '1 minute',\\\
        n      keyGenerator: realIp,\\n    },\\n  },\\n};\\n\\n// \u2500\u2500\u2500\
        \ Routes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\\n\\nawait app.register(healthRoutes);\\nawait app.register(adminRoutes,\
        \ { prefix: '/api/admin', rateLimitHooks: { authRateLimit, writeRateLimit\
        \ } });\\nawait app.register(socRoutes, { prefix: '/api/v4/soc', rateLimitHooks:\
        \ { writeRateLimit } });\\nawait app.register(socRoutes, { prefix: '/api/soc',\
        \ rateLimitHooks: { writeRateLimit } });\\nawait app.register(mailRoutes,\
        \ { rateLimitHooks: { authRateLimit, writeRateLimit } });\\nawait app.register(organizationRoutes,\
        \ { rateLimitHooks: { authRateLimit, writeRateLimit } });\\nawait app.register(contactsRoutes,\
        \ { rateLimitHooks: { authRateLimit, writeRateLimit } });\\n\\n// \u2500\u2500\
        \u2500 Global Error Handler \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\\n\\napp.setErrorHandler((err, req, reply)\
        \ =\\u003e {\\n  const statusCode = err.statusCode || 500;\\n  app.log.error({\
        \ err, url: sanitizedUrl(req.url), method: req.method }, 'Request error');\\\
        n  reply.status(statusCode).send({\\n    statusCode,\\n    error: err.name\
        \ || 'Error',\\n    message: statusCode \\u003c 500 ? err.message : 'Internal\
        \ Server Error',\\n  });\\n});\\n\\n// \u2500\u2500\u2500 Graceful Shutdown\
        \ \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\\n\\nconst shutdown = async (signal) =\\u003e {\\\
        n  app.log.info({ signal }, 'Received shutdown signal, closing server...');\\\
        n  await app.close();\\n  process.exit(0);\\n};\\n\\nprocess.on('SIGTERM',\
        \ () =\\u003e shutdown('SIGTERM'));\\nprocess.on('SIGINT',  () =\\u003e shutdown('SIGINT'));\\\
        n\\n// \u2500\u2500\u2500 Startup \u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
        \u2500\u2500\u2500\u2500\u2500\u2500\\n\\ntry {\\n  app.log.info('Running\
        \ database migrations...');\\n  await runMigrations();\\n  app.log.info('Migrations\
        \ complete.');\\n\\n  // Load blocked IPs into memory firewall\\n  const {\
        \ rows: blockedRows } = await pool.query('SELECT ip FROM soc_blocked_ips');\\\
        n  for (const row of blockedRows) {\\n    blockedIps.add(row.ip);\\n  }\\\
        n  app.log.info(`Firewall: Loaded ${blockedIps.size} blocked IPs from database.`);\\\
        n\\n  await app.listen({ port: PORT, host: HOST });\\n  app.log.info(`CaspMail\
        \ backend listening on ${HOST}:${PORT}`);\\n  \\n  startSoarWorker(app);\\\
        n} catch (err) {\\n  app.log.error(err, 'Fatal startup error');\\n  process.exit(1);\\\
        n}\\n\\nexport default app;\\n\"},\"kind\":\"ConfigMap\",\"metadata\":{\"\
        annotations\":{},\"name\":\"backend-patch-app\",\"namespace\":\"caspermail\"\
        }}\n"
