        {\n      headers: { ''X-Vault-Token'': VAULT_TOKEN }\n    });\n    \n    if
        (!res.ok) {\n      throw new Error(`Vault returned ${res.status}: ${await
        res.text()}`);\n    }\n\n    const data = await res.json();\n    cachedPassword
        = data.data.password;\n    // Cache for 5 minutes (Vault rotates every 15m)\n    passwordExpiresAt
        = Date.now() + (5 * 60 * 1000); \n    \n    console.log(''[pg pool] Successfully
        fetched dynamic password from Vault'');\n    return cachedPassword;\n  } catch
        (error) {\n    console.error(''[pg pool] Failed to fetch dynamic password:'',
