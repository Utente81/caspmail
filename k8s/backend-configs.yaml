- apiVersion: v1
  data:
    pool.mjs: "import pg from 'pg';\nimport { readFileSync } from 'node:fs';\n\nconst\
      \ { Pool } = pg;\n\nfunction buildConnectionString() {\n  if (process.env.DATABASE_URL)\
      \ return process.env.DATABASE_URL;\n\n  // Running inside Docker with secrets\
      \ mounted at /run/secrets/\n  let password;\n  try {\n    password = readFileSync('/run/secrets/postgres_password',\
      \ 'utf8').trim();\n  } catch {\n    throw new Error('DATABASE_URL env var or\
      \ /run/secrets/postgres_password secret is required');\n  }\n\n  const host\
      \ = process.env.DB_HOST || 'postgres';\n  const port = process.env.DB_PORT ||\
      \ '5432';\n  const user = process.env.DB_USER || 'caspermail';\n  const db \
      \  = process.env.DB_NAME || 'caspermail';\n  return `postgresql://${user}:${encodeURIComponent(password)}@${host}:${port}/${db}`;\n\
      }\n\nconst pool = new Pool({\n  connectionString: buildConnectionString(),\n\
      \  max: 20,\n  idleTimeoutMillis: 30_000,\n  connectionTimeoutMillis: 5_000,\n\
      \  ssl: process.env.DATABASE_SSL === 'true' ? { rejectUnauthorized: true } :\
      \ false,\n});\n\npool.on('error', (err) => {\n  console.error('[pg pool] Unexpected\
      \ client error', err);\n});\n\nexport async function withTransaction(fn) {\n\
      \  const client = await pool.connect();\n  try {\n    await client.query('BEGIN');\n\
      \    const result = await fn(client);\n    await client.query('COMMIT');\n \
      \   return result;\n  } catch (err) {\n    await client.query('ROLLBACK');\n\
      \    throw err;\n  } finally {\n    client.release();\n  }\n}\n\nexport default\
      \ pool;\n"
