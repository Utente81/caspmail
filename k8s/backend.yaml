apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: casper-backend
  namespace: caspermail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        prometheus.io/port: '9464'
        prometheus.io/scrape: 'true'
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: --import ./src/instrumentation.mjs
        - name: PORT
          value: '3000'
        - name: DB_HOST
          value: casper-cnpg-rw
        - name: DB_PORT
          value: '5432'
        - name: DB_USER
          value: caspermail
        - name: DB_NAME
          value: caspermail
        - name: DATABASE_SSL
          value: 'false'
        - name: KEYCLOAK_ISSUER
          value: https://auth.caspmail.com/realms/caspermail
        - name: KEYCLOAK_JWKS_URI
          value: http://casper-keycloak:8080/realms/caspermail/protocol/openid-connect/certs
        - name: KEYCLOAK_INTERNAL_URL
          value: http://casper-keycloak:8080
        - name: KEYCLOAK_REALM
          value: caspermail
        - name: KEYCLOAK_ADMIN_USER
          value: admin
        - name: SIEM_SECRET
          valueFrom:
            secretKeyRef:
              name: casper-secrets
              key: siem_secret
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              key: vault_token
              name: casper-secrets
        - name: CORS_ORIGINS
          value: https://caspmail.com,https://mail.caspmail.com,https://soc.caspmail.com
        - name: SMTP_HOST
          value: stalwart-service.caspermail.svc.cluster.local
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_USER
          value: admin
        - name: SMTP_PASS
          value: admin_secure_password_123
        image: ghcr.io/utente81/caspmail-backend:8d6dca0e124c725e3aeb641b2f38e8fb9599188d
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /run/secrets
          name: secrets
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/node_modules
          name: telemetry-node-modules
        - mountPath: /app/src/routes/soc.mjs
          name: patch-soc
          subPath: soc.mjs
        - mountPath: /app/src/services/vault.mjs
          name: patch-vault
          subPath: vault.mjs
        - mountPath: /app/src/app.mjs
          name: patch-app
          subPath: app.mjs
        - mountPath: /app/src/db/pool.mjs
          name: patch-pool
          subPath: pool.mjs
        - mountPath: /app/src/instrumentation.mjs
          name: patch-instrumentation
          subPath: instrumentation.mjs
        - mountPath: /app/src/routes/admin.mjs
          name: patch-admin-routes
          subPath: admin.mjs
        - mountPath: /app/src/routes/mail.mjs
          name: patch-mail-routes
          subPath: mail.mjs
        - mountPath: /app/src/services/soar.mjs
          name: patch-soar
          subPath: soar.mjs
      imagePullSecrets:
      - name: ghcr-login-secret
      initContainers:
      - command:
        - sh
        - -c
        - cp -a /app/node_modules/. /telemetry_node_modules/ && npm install --prefix
          /tmp/ext @opentelemetry/auto-instrumentations-node@0.47.1 @opentelemetry/exporter-prometheus@0.52.1
          @opentelemetry/exporter-trace-otlp-http@0.52.1 @opentelemetry/sdk-node@0.52.1
          && cp -a /tmp/ext/node_modules/. /telemetry_node_modules/
        image: ghcr.io/utente81/caspmail-backend:8d6dca0e124c725e3aeb641b2f38e8fb9599188d
        imagePullPolicy: IfNotPresent
        name: init-telemetry
        volumeMounts:
        - mountPath: /telemetry_node_modules
          name: telemetry-node-modules
      volumes:
      - emptyDir: {}
        name: telemetry-node-modules
      - emptyDir: {}
        name: tmp
      - name: secrets
        secret:
          secretName: casper-secrets
      - configMap:
          name: backend-patch-soc
        name: patch-soc
      - configMap:
          name: backend-vault
        name: patch-vault
      - configMap:
          name: backend-app
        name: patch-app
      - configMap:
          name: backend-pool
        name: patch-pool
      - configMap:
          name: backend-instrumentation
        name: patch-instrumentation
      - configMap:
          name: backend-admin-routes
        name: patch-admin-routes
      - configMap:
          name: backend-mail-routes
        name: patch-mail-routes
      - configMap:
          name: backend-soar
        name: patch-soar
---
apiVersion: v1
kind: Service
metadata:
  name: casper-backend
  namespace: caspermail
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casper-backend-hpa
  namespace: caspermail
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: casper-backend
