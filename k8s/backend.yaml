apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: backend
  name: casper-backend
  namespace: caspermail-enterprise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        prometheus.io/port: '9464'
        prometheus.io/scrape: 'true'
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: NODE_OPTIONS
          value: --import ./src/instrumentation.mjs
        - name: PORT
          value: '3000'
        - name: DB_HOST
          value: casper-cnpg-rw
        - name: DB_PORT
          value: '5432'
        - name: DB_USER
          value: caspermail
        - name: DB_NAME
          value: caspermail
        - name: DATABASE_SSL
          value: 'true'
        - name: KEYCLOAK_ISSUER
          value: https://auth.enterprise.caspmail.com/realms/caspermail
        - name: KEYCLOAK_JWKS_URI
          value: http://casper-keycloak:8080/realms/caspermail/protocol/openid-connect/certs
        - name: KEYCLOAK_INTERNAL_URL
          value: http://casper-keycloak:8080
        - name: KEYCLOAK_REALM
          value: caspermail
        - name: KEYCLOAK_ADMIN_USER
          value: admin
        - name: SIEM_SECRET
          valueFrom:
            secretKeyRef:
              key: siem_secret
              name: casper-secrets
        - name: VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              key: vault_token
              name: casper-secrets
        - name: CORS_ORIGINS
          value: https://enterprise.caspmail.com,https://mail.enterprise.caspmail.com,https://soc.enterprise.caspmail.com
        - name: SMTP_HOST
          value: stalwart-service.caspermail-enterprise.svc.cluster.local
        - name: SMTP_PORT
          value: '587'
        - name: SMTP_USER
          value: admin
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              key: stalwart_password
              name: casper-secrets
        - name: VAULT_ADDR
          value: https://casper-vault.caspermail-enterprise.svc.cluster.local:8200
        - name: VAULT_CACERT
          value: /etc/caspermail/vault-tls/tls.crt
        image: ghcr.io/utente81/caspmail-backend:9c3087ae0d3d5777f8f9a862373672293ea518a9
        imagePullPolicy: IfNotPresent
        name: backend
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /run/secrets
          name: secrets
          readOnly: true
        - mountPath: /tmp
          name: tmp
        - mountPath: /etc/caspermail/db-ca
          name: db-ca
          readOnly: true
        - mountPath: /app/node_modules
          name: telemetry-node-modules
        - name: vault-tls
          mountPath: /etc/caspermail/vault-tls
          readOnly: true
      imagePullSecrets:
      - name: ghcr-login-secret
      initContainers:
      - command:
        - sh
        - -c
        - cp -a /app/node_modules/. /telemetry_node_modules/ && npm install --prefix
          /tmp/ext @opentelemetry/auto-instrumentations-node@0.47.1 @opentelemetry/exporter-prometheus@0.52.1
          @opentelemetry/exporter-trace-otlp-http@0.52.1 @opentelemetry/sdk-node@0.52.1
          && cp -a /tmp/ext/node_modules/. /telemetry_node_modules/
        image: ghcr.io/utente81/caspmail-backend:9c3087ae0d3d5777f8f9a862373672293ea518a9
        imagePullPolicy: IfNotPresent
        name: init-telemetry
        volumeMounts:
        - mountPath: /telemetry_node_modules
          name: telemetry-node-modules
      volumes:
      - emptyDir: {}
        name: telemetry-node-modules
      - emptyDir: {}
        name: tmp
      - name: secrets
        secret:
          secretName: casper-secrets
      - name: db-ca
        secret:
          secretName: casper-cnpg-ca
          items:
          - key: ca.crt
            path: ca.crt
      - name: vault-tls
        secret:
          secretName: vault-tls
---
apiVersion: v1
kind: Service
metadata:
  name: casper-backend
  namespace: caspermail-enterprise
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: casper-backend-hpa
  namespace: caspermail-enterprise
spec:
  maxReplicas: 10
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: casper-backend
