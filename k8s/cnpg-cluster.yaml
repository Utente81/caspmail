apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: cnpg-app-secret
  namespace: caspermail
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      name: cnpg-app-secret
      namespace: caspermail
    type: kubernetes.io/basic-auth
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: casper-cnpg
  namespace: caspermail
spec:
  affinity:
    nodeSelector:
      tier: secure-data
    tolerations:
    - effect: NoSchedule
      key: secure-data
      operator: Equal
      value: 'true'
  backup:
    barmanObjectStore:
      destinationPath: s3://pg-backup/
      endpointURL: http://minio.caspermail.svc.cluster.local:9000
      s3Credentials:
        accessKeyId:
          key: ACCESS_KEY_ID
          name: cnpg-minio-creds
        secretAccessKey:
          key: ACCESS_SECRET_KEY
          name: cnpg-minio-creds
      wal:
        compression: gzip
        maxParallel: 1
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: caspermail
      owner: caspermail
      secret:
        name: cnpg-app-secret
  instances: 3
  postgresql:
    syncReplicaElectionConstraint:
      enabled: false
  storage:
    size: 2Gi
  walStorage:
    size: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: casper-cnpg-daily-backup
  namespace: caspermail
spec:
  backupOwnerReference: self
  cluster:
    name: casper-cnpg
  schedule: 0 0 2 * * *
