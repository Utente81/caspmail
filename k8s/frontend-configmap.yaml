apiVersion: v1
kind: ConfigMap
metadata:
  name: casper-frontend-config
  namespace: caspermail-enterprise
data:
  default.conf: |
    server {
        listen       8080;
        server_name  _;
        absolute_redirect off;
        port_in_redirect off;

        root   /usr/share/nginx/html;
        index  index.html;

        # Static assets
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Multi-page routing
        location /console/login {
            try_files /login.html =404;
        }

        location /console/soc {
            try_files /soc.html =404;
        }

        location /console/admin {
            try_files /admin.html =404;
        }

        location /console/ {
            try_files $uri $uri/ /index.html;
        }

        location = / {
            return 301 /console/login;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
