apiVersion: apps/v1
kind: Deployment
metadata:
  name: casper-frontend
  namespace: caspermail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
      - name: ghcr-login-secret
      containers:
      - image: ghcr.io/utente81/caspmail-frontend:6d22a9e400e2d23c07f9bc3c6f520f0700174a89
        securityContext:
          readOnlyRootFilesystem: true
        imagePullPolicy: IfNotPresent
        name: frontend
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - mountPath: /etc/nginx/conf.d/default.conf
          name: nginx-config
          subPath: default.conf
        - mountPath: /tmp
          name: tmp-volume
        - mountPath: /var/cache/nginx
          name: cache-volume
        - mountPath: /var/run
          name: run-volume
        - mountPath: /var/log/nginx
          name: log-volume
      volumes:
      - configMap:
          defaultMode: 420
          name: casper-frontend-config
        name: nginx-config
      - name: tmp-volume
        emptyDir: {}
      - name: cache-volume
        emptyDir: {}
      - name: run-volume
        emptyDir: {}
      - name: log-volume
        emptyDir: {}
