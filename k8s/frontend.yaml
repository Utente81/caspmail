apiVersion: apps/v1
kind: Deployment
metadata:
  name: casper-frontend
  namespace: caspermail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-login-secret
      containers: # nosemgrep
        - image: ghcr.io/utente81/caspmail-frontend:436c040660021e6752d4b7bc6546fa810a828041
          securityContext:
            readOnlyRootFilesystem: true
          imagePullPolicy: IfNotPresent
          name: frontend
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: html-volume
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-config
              subPath: default.conf
            - mountPath: /tmp
              name: tmp-volume
            - mountPath: /var/cache/nginx
              name: cache-volume
            - mountPath: /var/run
              name: run-volume
            - mountPath: /var/log/nginx
              name: log-volume
      volumes:
        - name: html-volume
          hostPath:
            path: /home/ubuntu/caspmail/new/frontend/dist
            type: Directory
        - configMap:
            defaultMode: 420
            name: casper-frontend-config
          name: nginx-config
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: run-volume
          emptyDir: {}
        - name: log-volume
          emptyDir: {}
