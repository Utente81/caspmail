apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: caspermail
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'CaspMail'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: caspermail
data:
  auditing.json: |
    {
      "title": "Security & Auditing",
      "timezone": "browser",
      "schemaVersion": 36,
      "refresh": "10s",
      "panels": [
        {
          "type": "logs",
          "title": "SIEM Audit Logs",
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "{app=\"backend\"} |= \"SIEM_EVENT\"",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "Loki"
              }
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
  observability.json: |
    {
      "title": "Backend Observability",
      "timezone": "browser",
      "schemaVersion": 36,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP Request Duration (ms)",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_duration_bucket[5m])) by (le))",
              "legendFormat": "P95 Latency",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              }
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_duration_count[5m]))",
              "legendFormat": "Requests / sec",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "Prometheus"
              }
            }
          ]
        }
      ]
    }
