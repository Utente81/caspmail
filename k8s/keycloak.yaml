apiVersion: apps/v1
kind: Deployment
metadata:
  name: casper-keycloak
  namespace: caspermail
  labels:
    app: keycloak
spec:
  replicas: 2
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:25.0
        command: ["/bin/bash", "-c"]
        args: 
          - |
            /opt/keycloak/bin/kc.sh start
        env:
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://casper-pg-postgresql-primary:5432/caspermail
        - name: KC_DB_USERNAME
          value: caspermail
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: casper-secrets
              key: postgres_password
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: casper-secrets
              key: keycloak_admin_password
        - name: KC_HOSTNAME
          value: auth.secure.internal
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HTTP_PORT
          value: "8080"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_LOG_LEVEL
          value: INFO
        - name: KC_HEALTH_ENABLED
          value: "true"
        # JGroups for HA clustering
        - name: JGROUPS_DISCOVERY_PROTOCOL
          value: dns.DNS_PING
        - name: JGROUPS_DISCOVERY_PROPERTIES
          value: "dns_query=casper-keycloak-headless.caspermail.svc.cluster.local"
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: casper-keycloak
  namespace: caspermail
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: casper-keycloak-headless
  namespace: caspermail
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
spec:
  clusterIP: None
  selector:
    app: keycloak
  ports:
    - port: 7600
      name: jgroups
    - port: 57600
      name: jgroups-fd
