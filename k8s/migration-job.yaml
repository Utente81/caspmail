apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-migration-config
  namespace: caspermail
data:
  migrate.hcl: |
    cluster_addr = "http://127.0.0.1:8201"

    storage_source "file" {
      path = "/vault/source"
    }

    storage_destination "raft" {
      path = "/vault/destination"
      node_id = "casper-vault-0"
    }

    seal "transit" {
      address         = "http://casper-vault-kms.caspermail.svc.cluster.local:8200"
      disable_renewal = "false"
      key_name        = "autounseal"
      mount_path      = "transit"
      tls_skip_verify = "true"
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-migration-job
  namespace: caspermail
spec:
  template:
    spec:
      restartPolicy: Never
      containers: # nosemgrep
        - name: migration
          image: hashicorp/vault:1.15
          command: ["vault", "operator", "migrate", "-config=/vault/config/migrate.hcl"]
          env:
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-token
                  key: token
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: source-data
              mountPath: /vault/source
            - name: dest-data
              mountPath: /vault/destination
      volumes:
        - name: config
          configMap:
            name: vault-migration-config
        - name: source-data
          persistentVolumeClaim:
            claimName: vault-data
        - name: dest-data
          persistentVolumeClaim:
            claimName: data-casper-vault-0
