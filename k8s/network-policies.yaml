apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: protect-data-layer
  namespace: caspermail
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["postgresql", "redis"]
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
