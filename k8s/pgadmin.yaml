apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: caspermail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:8.8
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: admin@caspermail.com
        - name: PGADMIN_DEFAULT_PASSWORD
          value: admin123
        - name: PGADMIN_SERVER_JSON_FILE
          value: /pgadmin4/servers.json
        ports:
        - containerPort: 80
        volumeMounts:
        - name: pgadmin-servers
          mountPath: /pgadmin4/servers.json
          subPath: servers.json
      volumes:
      - name: pgadmin-servers
        configMap:
          name: pgadmin-servers
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: caspermail
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: pgadmin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: caspermail
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Primary (Read-Write)",
          "Group": "Servers",
          "Host": "casper-pg-postgresql-primary",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "caspermail",
          "SSLMode": "prefer"
        },
        "2": {
          "Name": "Replica (Read-Only)",
          "Group": "Servers",
          "Host": "casper-pg-postgresql-read",
          "Port": 5432,
          "MaintenanceDB": "postgres",
          "Username": "caspermail",
          "SSLMode": "prefer"
        }
      }
    }
