apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: caspermail
spec:
  schedule: "0 2 * * *" # Every day at 2:00 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:latest
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: casper-secrets
                      key: postgres_password
                - name: MINIO_ROOT_USER
                  valueFrom:
                    secretKeyRef:
                      name: casper-secrets
                      key: minio_root_user
                - name: MINIO_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: casper-secrets
                      key: minio_root_password
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache postgresql-client curl
                  wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  
                  echo "Configuring MinIO client..."
                  mc alias set minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  
                  echo "Ensuring backup bucket exists..."
                  mc mb minio/pg-backups || true
                  
                  BACKUP_FILE="caspermail_backup_$(date +%F_%H-%M-%S).dump"
                  echo "Running pg_dump..."
                  pg_dump -h casper-pg-postgresql-primary -U caspermail -d caspermail -F c > "/tmp/$BACKUP_FILE"
                  
                  echo "Uploading backup to MinIO..."
                  mc cp "/tmp/$BACKUP_FILE" minio/pg-backups/
                  
                  echo "Cleaning up backups older than 30 days..."
                  mc rm --recursive --force --older-than 30d minio/pg-backups/ || true
                  
                  echo "Backup completed successfully!"
