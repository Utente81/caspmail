apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: caspermail-security-headers
  namespace: caspermail
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' wss: https: http:; frame-src 'self'; object-src 'none';"
    customFrameOptionsValue: SAMEORIGIN
    contentTypeNosniff: true
    browserXssFilter: true
    forceSTSHeader: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
