apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-kms-data
  namespace: caspermail
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-kms-config
  namespace: caspermail
data:
  vault.json: |
    {
      "listener": {
        "tcp": {
          "address": "0.0.0.0:8200",
          "tls_disable": 1
        }
      },
      "storage": {
        "file": {
          "path": "/vault/file"
        }
      },
      "ui": true,
      "disable_mlock": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: casper-vault-kms
  namespace: caspermail
  labels:
    app: vault-kms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-kms
  template:
    metadata:
      labels:
        app: vault-kms
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:1.15
        command: ["vault", "server", "-config=/vault/config/vault.json"]
        ports:
        - containerPort: 8200
          name: http
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        volumeMounts:
        - name: config
          mountPath: /vault/config
        - name: data
          mountPath: /vault/file
      volumes:
      - name: config
        configMap:
          name: vault-kms-config
      - name: data
        persistentVolumeClaim:
          claimName: vault-kms-data
---
apiVersion: v1
kind: Service
metadata:
  name: casper-vault-kms
  namespace: caspermail
spec:
  selector:
    app: vault-kms
  ports:
    - port: 8200
      targetPort: 8200
