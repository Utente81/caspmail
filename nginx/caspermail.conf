server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name secure.internal mail.secure.internal soc.secure.internal;
    client_max_body_size 50M;

    ssl_certificate     /etc/ssl/caspermail/fullchain.pem;
    ssl_certificate_key /etc/ssl/caspermail/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security   "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "SAMEORIGIN" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy:
    #   - default-src 'self'  → only same origin by default
    #   - script-src 'self'   → no inline scripts or eval
    #   - style-src 'self' 'unsafe-inline'  → React inline styles allowed
    #   - img-src 'self' data: → data URIs for avatars/icons
    #   - connect-src 'self' wss: → WebSocket for SOC SSE + API calls
    #   - frame-ancestors 'none' → prevents clickjacking
    #   - form-action 'self'
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: https://auth.secure.internal; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none';"
        always;

    proxy_read_timeout    60s;
    proxy_connect_timeout 5s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health probe ────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # ── SOC SSE streams (no buffering) ──────────────────────────────────────
    location = /api/soc/stream {
        access_log off;
        proxy_pass http://backend:3000;
        proxy_buffering off;
        proxy_cache    off;
        proxy_read_timeout 3600s;   # keep SSE connections alive
    }

    location = /api/v4/soc/stream {
        access_log off;
        proxy_pass http://backend:3000;
        proxy_buffering off;
        proxy_cache    off;
        proxy_read_timeout 3600s;
    }

    # ── Backend API ─────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_buffering off;
        proxy_cache    off;
    }

    # ── Keycloak (auth flows) ───────────────────────────────────────────────
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /realms/ {
        proxy_pass http://keycloak:8080/realms/;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_set_header X-Forwarded-Port 443;
    }

    # ── Static root files (images, fonts, favicons, json) ──────────────────
    location ~* ^/[^/]+\.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|otf|json)$ {
        proxy_pass http://frontend:80;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Static assets (long-lived cache) ───────────────────────────────────
    location /assets/ {
        proxy_pass http://frontend:80/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Frontend SPA routes ─────────────────────────────────────────────────
    location /console/login {
        proxy_pass http://frontend:80/login.html;
    }

    location /console/soc {
        proxy_pass http://frontend:80/soc.html;
    }

    location /console/admin {
        proxy_pass http://frontend:80/admin.html;
    }

    location /console/ {
        proxy_pass http://frontend:80/;
    }

    location = / {
        return 301 /console/login;
    }

    # ── Security: block hidden files ────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ── Keycloak public endpoint ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name auth.secure.internal;

    ssl_certificate     /etc/ssl/caspermail/fullchain.pem;
    ssl_certificate_key /etc/ssl/caspermail/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}
