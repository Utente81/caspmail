# Frontend static nginx — serves Vite-built SPA files
# This runs inside the `frontend` container (port 80, internal only)

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Disable access log for health checks
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ── Vite assets (hashed filenames → long cache) ───────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Named HTML entry points ───────────────────────────────────────────────
    location = /soc.html   { try_files /soc.html   =404; }
    location = /admin.html { try_files /admin.html  =404; }
    location = /login.html { try_files /login.html  =404; }

    # ── Default SPA fallback → index.html ────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
